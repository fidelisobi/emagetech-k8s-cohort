# ============================================================
# Pod with an Init Container
# ============================================================
# Init containers run to completion BEFORE the main containers
# start. They are useful for:
#   - Waiting for a dependency (database, service) to be ready
#   - Seeding files into a shared volume
#   - Running migrations or setup scripts
#   - Checking permissions or configuration
#
# Key properties of init containers:
#   - They run sequentially (if there are multiple)
#   - Each must exit with code 0 before the next one starts
#   - If an init container fails, the pod restarts (honours restartPolicy)
#   - Main containers do NOT start until ALL init containers succeed
#   - They can use different images from the main containers
#   - They can share volumes with main containers
#
# This pod simulates waiting for a Kubernetes Service called
# "my-backend-service" to be resolvable via DNS before starting
# nginx. The init container uses an nslookup loop.
# ============================================================

apiVersion: v1
kind: Pod
metadata:
  name: init-container-demo
  namespace: default
  labels:
    app: init-demo
    lab: "14-pod-lifecycle"
  annotations:
    description: "Demonstrates an init container that waits for DNS before main container starts"

spec:
  # --------------------------------------------------------
  # Init Containers
  # --------------------------------------------------------
  # init containers run sequentially before any main container.
  # The field is a list — you can have multiple init containers.
  # --------------------------------------------------------
  initContainers:
    - name: wait-for-dns
      # busybox is a tiny Linux image (~5 MB) that includes
      # nslookup, wget, sleep, and other basic utilities.
      # It is the go-to image for init and debug containers.
      image: busybox:1.36

      # This command loops until nslookup resolves the target hostname.
      # Kubernetes DNS resolves Services as:
      #   <service-name>.<namespace>.svc.cluster.local
      #
      # The loop:
      #   - Tries nslookup every 2 seconds
      #   - nslookup exits with code 0 on success, non-zero on failure
      #   - The shell 'until' loop keeps retrying until exit code is 0
      #   - Once DNS resolves, the init container exits 0 and the
      #     main nginx container starts
      #
      # NOTE FOR THE LAB: "my-backend-service" does NOT exist, so the
      # init container will stay in "Init:0/1" until you create that
      # Service. The README walks you through this intentionally.
      command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for my-backend-service to be resolvable via DNS..."
          until nslookup my-backend-service.default.svc.cluster.local; do
            echo "DNS lookup failed. Retrying in 2 seconds..."
            sleep 2
          done
          echo "my-backend-service is now reachable! Starting main container."

      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"

  # --------------------------------------------------------
  # Main Containers
  # --------------------------------------------------------
  # These start only after ALL init containers have succeeded.
  # --------------------------------------------------------
  containers:
    - name: nginx
      image: nginx:1.25

      ports:
        - containerPort: 80

      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"

      # A readiness probe on the main container is independent of
      # the init container check. Even after init succeeds, the
      # readiness probe must pass before traffic is routed here.
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
        failureThreshold: 3

  restartPolicy: Always

---
# ============================================================
# The Service that "unblocks" the init container
# ============================================================
# Applying this Service creates a DNS entry:
#   my-backend-service.default.svc.cluster.local
#
# The init container's nslookup loop will resolve successfully
# once this Service exists, allowing the main container to start.
#
# During the lab, apply the pod first (without this Service) to
# observe the Init:0/1 state, then apply this Service to watch
# the pod transition to Running.
# ============================================================
apiVersion: v1
kind: Service
metadata:
  # This name must match what the init container's nslookup queries
  name: my-backend-service
  namespace: default
  labels:
    lab: "14-pod-lifecycle"
    purpose: "unblocks-init-container"
  annotations:
    description: "Creating this Service unblocks the init container DNS wait loop"
spec:
  # selector intentionally matches nothing — we just need the DNS entry to exist.
  # In a real scenario this would point to backend pod labels.
  selector:
    app: my-backend   # No pods have this label in the lab

  ports:
    - protocol: TCP
      port: 80         # The port the Service listens on
      targetPort: 80   # The port on the pods (irrelevant here since no pods match)

  # ClusterIP is the default Service type — creates a stable virtual IP
  # that is registered in cluster DNS under <name>.<namespace>.svc.cluster.local
  type: ClusterIP
