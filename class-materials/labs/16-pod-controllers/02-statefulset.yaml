# ============================================================
# Lab 16 — Pod Controllers
# File 02: StatefulSet + Headless Service
# ============================================================
# A StatefulSet provides:
#   - Stable, ordered pod names: <name>-0, <name>-1, ...
#   - Stable network identities via a Headless Service
#   - Ordered, graceful scaling and updates
#
# A Headless Service (clusterIP: None) does NOT get a virtual IP.
# Instead DNS returns A records for each pod, allowing direct
# pod addressing:  <pod-name>.<service-name>.<namespace>.svc.cluster.local
#
# NOTE: For lab simplicity we use emptyDir (ephemeral) storage.
#       Lab 20 covers PersistentVolumeClaims properly.
#
# Apply:
#   kubectl apply -f 02-statefulset.yaml
# ============================================================

# --- Headless Service ----------------------------------------
# Must be created BEFORE the StatefulSet that references it.
# The StatefulSet spec.serviceName must match this Service name.
apiVersion: v1
kind: Service
metadata:
  name: db-headless          # referenced by StatefulSet.spec.serviceName
  namespace: controllers-lab
  labels:
    lab: "16-pod-controllers"
spec:
  # clusterIP: None makes this a headless service.
  # No load-balancing VIP is created; DNS returns individual pod IPs.
  clusterIP: None
  selector:
    app: db                  # routes to pods with label app=db
  ports:
    - name: db
      port: 5432
      targetPort: 5432

---
# --- StatefulSet ---------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: controllers-lab
  labels:
    lab: "16-pod-controllers"
spec:
  # serviceName links this StatefulSet to the headless Service above.
  # Each pod gets a DNS name: db-0.db-headless.controllers-lab.svc.cluster.local
  serviceName: "db-headless"

  replicas: 3    # creates db-0, db-1, db-2 in order

  selector:
    matchLabels:
      app: db

  # updateStrategy controls how pods are updated.
  # RollingUpdate with Parallel would update all at once (faster).
  # Default (OrderedReady) updates one pod at a time, highest ordinal first.
  updateStrategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: db
    spec:
      # terminationGracePeriodSeconds: give the app time to flush
      # state before the pod is killed.
      terminationGracePeriodSeconds: 10
      containers:
        - name: db
          # Using busybox so we can observe ordinal naming without
          # needing a real database setup.
          image: busybox:1.36
          # Print the pod's hostname (which is its ordinal name) every 5s
          command: ["sh", "-c", "while true; do echo \"I am $(hostname)\"; sleep 5; done"]
          ports:
            - containerPort: 5432
              name: db
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            # Each pod gets its OWN data directory via the volume claim below.
            # Even if two pods were on the same node, they would have separate data.
            - name: data
              mountPath: /data

      # --- Volume -------------------------------------------
      # emptyDir is ephemeral (data lost when pod is deleted).
      # In a real StatefulSet you would use volumeClaimTemplates
      # (shown in Lab 20 — Storage) to get a persistent PVC per pod.
      volumes:
        - name: data
          emptyDir: {}
