# ============================================================
# Lab 22 — Troubleshooting Scenarios
# File 03: Pending Pod (Insufficient Resources)
# ============================================================
# SCENARIO: A pod is stuck in Pending state — it never starts.
#
# ROOT CAUSE (spoiler — try to find it first!):
#   The pod requests 100 CPU cores.  No GKE node has that many
#   allocatable CPUs.  The scheduler cannot find a node to place
#   the pod and it stays Pending indefinitely.
#
# DIAGNOSIS COMMANDS:
#   kubectl describe pod pending-pod -n troubleshoot-lab
#   # Look at Events: "0/N nodes are available: N Insufficient cpu"
#
#   kubectl get events -n troubleshoot-lab --sort-by='.lastTimestamp'
#   # Shows FailedScheduling events
#
# COMMON CAUSES OF PENDING PODS:
#   1. Insufficient CPU or memory (this scenario)
#   2. Node selector or affinity rules with no matching node
#   3. Taint on all nodes with no matching toleration in the pod
#   4. PVC cannot be bound (storage not available)
#   5. Namespace ResourceQuota exceeded
#
# Apply:
#   kubectl apply -f 03-pending-pod.yaml
# ============================================================

apiVersion: v1
kind: Pod
metadata:
  name: pending-pod
  namespace: troubleshoot-lab
  labels:
    lab: "22-troubleshooting"
    scenario: "pending"
spec:
  restartPolicy: Never
  containers:
    - name: compute-hog
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          # BUG: 100 CPU cores — no real GKE node has this many
          # allocatable CPUs.  A standard GKE node has 2-16 vCPUs.
          cpu: "100"
          memory: "64Mi"
        limits:
          cpu: "100"
          memory: "64Mi"

# ============================================================
