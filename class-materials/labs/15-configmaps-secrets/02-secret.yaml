# ============================================================
# Lab 15 — ConfigMaps, Secrets, and the Downward API
# File 02: Secret
# ============================================================
# Secrets store sensitive data. At rest they are base64-encoded
# (NOT encrypted by default — GKE supports envelope encryption
# with Cloud KMS for real protection).
#
# stringData lets you write plain text; Kubernetes base64-encodes
# it automatically on admission.  Use `kubectl get secret -o yaml`
# to see the base64-encoded result.
#
# Apply:
#   kubectl apply -f 02-secret.yaml
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: cm-secrets-lab
  labels:
    lab: "15-configmaps-secrets"
# type: Opaque is the default for arbitrary key-value secrets.
# Other built-in types: kubernetes.io/tls, kubernetes.io/dockerconfigjson, etc.
type: Opaque
# stringData accepts plain text — Kubernetes converts it to base64.
# If you kubectl apply this file, re-reading it with `kubectl get secret -o yaml`
# will show the `data` block with base64-encoded values, not stringData.
stringData:
  DB_USER: "labuser"
  DB_PASSWORD: "s3cr3tP@ssw0rd!"
  # A multi-line secret (e.g. a connection string or private key)
  DB_URL: "postgresql://labuser:s3cr3tP@ssw0rd!@postgres.cm-secrets-lab.svc.cluster.local:5432/labdb"
