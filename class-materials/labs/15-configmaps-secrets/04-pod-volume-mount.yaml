# ============================================================
# Lab 15 — ConfigMaps, Secrets, and the Downward API
# File 04: Pod — Volume Mounts + Downward API
# ============================================================
# Demonstrates three volume mount patterns:
#
#   1. ConfigMap volume — CM keys become files in the container.
#      When the CM is updated, files refresh automatically
#      (within ~60 seconds via the kubelet sync interval).
#
#   2. Secret volume — Secret keys become files, with
#      permissions defaulting to 0644 (override with mode).
#
#   3. Downward API volume — exposes pod metadata (name,
#      namespace, labels, annotations) as files WITHOUT needing
#      the pod to call the Kubernetes API.
#
# Apply:
#   kubectl apply -f 04-pod-volume-mount.yaml
# ============================================================

apiVersion: v1
kind: Pod
metadata:
  name: volume-mount-pod
  namespace: cm-secrets-lab
  labels:
    lab: "15-configmaps-secrets"
    demo: "volume-mount"
    # This annotation will be exposed via the Downward API
    maintainer: "platform-team"
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"

      volumeMounts:
        # -------------------------------------------------------
        # 1. ConfigMap mounted as a directory of files.
        #    Each ConfigMap key becomes a file in /etc/config/.
        #    e.g. /etc/config/LOG_LEVEL, /etc/config/app.properties
        # -------------------------------------------------------
        - name: config-volume
          mountPath: /etc/config   # directory created in the container

        # -------------------------------------------------------
        # 2. Secret mounted as a directory of files.
        #    Each Secret key becomes a file in /etc/secret/.
        #    Files are owned by root and permissions are 0400 by
        #    default when defaultMode is set below.
        # -------------------------------------------------------
        - name: secret-volume
          mountPath: /etc/secret
          readOnly: true           # best practice: always readOnly for secrets

        # -------------------------------------------------------
        # 3. Downward API: pod metadata exposed as files.
        #    No API call needed — kubelet injects the values.
        # -------------------------------------------------------
        - name: podinfo
          mountPath: /etc/podinfo

  volumes:
    # --- Volume 1: ConfigMap ------------------------------------
    - name: config-volume
      configMap:
        name: app-config
        # defaultMode: 0644 is the default file permission
        # You can restrict individual items:
        # items:
        #   - key: app.properties
        #     path: app.properties
        #     mode: 0400   # read-only for owner only

    # --- Volume 2: Secret ---------------------------------------
    - name: secret-volume
      secret:
        secretName: app-secret
        # Restrict permissions to owner-read-only (recommended)
        defaultMode: 0400

    # --- Volume 3: Downward API ---------------------------------
    # The Downward API surfaces pod/container metadata as files
    # without requiring the app to call the Kubernetes API server.
    - name: podinfo
      downwardAPI:
        items:
          # Pod name → /etc/podinfo/pod-name
          - path: "pod-name"
            fieldRef:
              fieldPath: metadata.name
          # Pod namespace → /etc/podinfo/namespace
          - path: "namespace"
            fieldRef:
              fieldPath: metadata.namespace
          # Pod labels (all) → /etc/podinfo/labels
          - path: "labels"
            fieldRef:
              fieldPath: metadata.labels
          # Pod annotations (all) → /etc/podinfo/annotations
          - path: "annotations"
            fieldRef:
              fieldPath: metadata.annotations
          # Memory limit of THIS container → /etc/podinfo/mem-limit
          - path: "mem-limit"
            resourceFieldRef:
              containerName: app
              resource: limits.memory
