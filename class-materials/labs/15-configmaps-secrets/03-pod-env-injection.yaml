# ============================================================
# Lab 15 — ConfigMaps, Secrets, and the Downward API
# File 03: Pod — Environment Variable Injection
# ============================================================
# Demonstrates two ways to inject ConfigMap and Secret values
# as environment variables:
#
#   1. envFrom  — bulk import: every key becomes an env var.
#   2. valueFrom — selective import: pick individual keys.
#
# Environment variables are set at pod start time and do NOT
# update when the ConfigMap or Secret changes.  To pick up
# changes you must restart (delete) the pod.
#
# Apply (namespace must exist first):
#   kubectl create namespace cm-secrets-lab
#   kubectl apply -f 01-configmap.yaml -f 02-secret.yaml
#   kubectl apply -f 03-pod-env-injection.yaml
# ============================================================

apiVersion: v1
kind: Pod
metadata:
  name: env-injection-pod
  namespace: cm-secrets-lab
  labels:
    lab: "15-configmaps-secrets"
    demo: "env-injection"
spec:
  # restartPolicy: Never so the pod stays in Completed state
  # after the sleep finishes (easier to inspect logs/env).
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      # Keep the container alive so we can exec into it.
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"

      # -------------------------------------------------------
      # Method 1 — envFrom: bulk import all keys from a source.
      # Every key in the ConfigMap or Secret becomes an env var.
      # -------------------------------------------------------
      envFrom:
        # Import all keys from the ConfigMap (LOG_LEVEL, DB_HOST, DB_PORT, APP_ENV)
        - configMapRef:
            name: app-config
        # Import all keys from the Secret (DB_USER, DB_PASSWORD, DB_URL)
        - secretRef:
            name: app-secret

      # -------------------------------------------------------
      # Method 2 — env[].valueFrom: pick individual keys.
      # This lets you rename the env var or select a single key.
      # -------------------------------------------------------
      env:
        # Rename: ConfigMap key LOG_LEVEL → env var LOGGING_LEVEL
        - name: LOGGING_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL   # must match a key in the ConfigMap

        # Rename: Secret key DB_PASSWORD → env var DATABASE_PASSWORD
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD  # must match a key in the Secret
              # optional: true  # uncomment to avoid pod failure if key is missing
