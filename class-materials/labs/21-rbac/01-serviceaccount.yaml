# ============================================================
# Lab 21 — RBAC and Resource Quotas
# File 01: ServiceAccount
# ============================================================
# A ServiceAccount provides an identity for processes running
# in a pod.  When a pod makes calls to the Kubernetes API
# (e.g. running kubectl, or an operator watching resources),
# it authenticates as its ServiceAccount.
#
# By default, pods use the "default" ServiceAccount in their
# namespace, which has no RBAC permissions beyond what is
# granted by default.
#
# Apply:
#   kubectl create namespace rbac-lab
#   kubectl apply -f 01-serviceaccount.yaml
# ============================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-user
  namespace: rbac-lab
  labels:
    lab: "21-rbac"
  annotations:
    # This annotation is for documentation only — no functional effect.
    # In GKE Workload Identity, you would annotate with:
    #   iam.gke.io/gcp-service-account: gsa@project.iam.gserviceaccount.com
    description: "ServiceAccount for lab dev-user — read-only access to pods and services"
# automountServiceAccountToken: false
# Uncomment the line above to prevent automatic token mounting.
# Useful for pods that don't need API access (security best practice).
# We leave it commented so our test-pod can use the token.
