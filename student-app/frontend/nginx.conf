# =============================================================================
# K8S CONCEPT: Service Discovery
# Nginx proxies /api/* to the API service using Kubernetes DNS.
# "student-app-api" resolves via CoreDNS to the ClusterIP of the api Service.
# No hardcoded IP addresses — this is how microservices find each other in K8s.
#
# Traffic flow: browser -> LoadBalancer/Ingress -> frontend pod (nginx)
#                                                     -> /api/* proxied to api Service
#                                                     -> /* served as static HTML
# =============================================================================

worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access logs — readable with: kubectl logs <frontend-pod>
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # ------------------------------------------------------------------
        # Proxy /api/* and /  (the API root info endpoint) to the API service.
        # K8S CONCEPT: "student-app-api" is resolved by CoreDNS.
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass         http://student-app-api:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # The JS in index.html fetches "/" to get pod info (Downward API demo).
        # We use a named prefix to avoid ambiguity with the static root.
        location /pod-info {
            proxy_pass         http://student-app-api:5000/;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
        }

        # ------------------------------------------------------------------
        # Static frontend files — served directly by Nginx
        # ------------------------------------------------------------------
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Simple health endpoint for the frontend container itself
        location /nginx-health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
