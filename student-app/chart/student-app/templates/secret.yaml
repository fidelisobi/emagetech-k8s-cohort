# =============================================================================
# K8S CONCEPT: Secret
#
# Secrets are base64-encoded (NOT encrypted by default).
# For real production use:
#   - Enable etcd encryption at rest (GKE: customer-managed encryption keys)
#   - Use Sealed Secrets or External Secrets Operator to avoid storing
#     plaintext passwords in your Git repo.
#
# Students: try "kubectl get secret <name> -o yaml" to see the base64 values.
#           Then decode with: echo <value> | base64 -d
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "student-app.fullname" . }}-secret
  labels:
    {{- include "student-app.labels" . | nindent 4 }}
type: Opaque
# Helm's b64enc function base64-encodes the value automatically.
data:
  DB_USER:     {{ .Values.api.secret.dbUser     | b64enc | quote }}
  DB_PASSWORD: {{ .Values.api.secret.dbPassword | b64enc | quote }}
