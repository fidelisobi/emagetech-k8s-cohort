# =============================================================================
# Nginx config for Docker Compose
#
# Identical to nginx.conf except the proxy_pass targets use the Docker Compose
# service name "api" instead of the Kubernetes service name "student-app-api".
#
# In Kubernetes:       proxy_pass http://student-app-api:5000  (CoreDNS)
# In Docker Compose:   proxy_pass http://api:5000              (Docker DNS)
#
# This file is mounted as a volume override in docker-compose.yml.
# =============================================================================

worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # Proxy API requests to the "api" service (Docker Compose DNS)
        location /api/ {
            proxy_pass         http://api:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # Pod info endpoint (Downward API demo)
        location /pod-info {
            proxy_pass         http://api:5000/;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 10s;
        }

        # Static frontend
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Health check
        location /nginx-health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
